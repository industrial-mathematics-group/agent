# Documentation site, built with Zensical (https://zensical.org), set up by the docs writer:
#   pip install zensical && zensical serve      # preview on http://localhost:8000
#   zensical build --clean                      # static site in site/
[project]
site_name = "agent"
site_description = "agent"
site_url = "https://industrial-mathematics-group.github.io/agent/"
repo_url = "https://github.com/industrial-mathematics-group/agent"
repo_name = "industrial-mathematics-group/agent"
nav = [
  { "IMGAgent" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/reserve-name.md",
    "getting-started/github-app.md",
    "getting-started/deploy.md",
    "getting-started/expose.md",
    "getting-started/per-repository.md",
  ] },
  { "Using IMGAgent" = [
    "usage/index.md",
    "usage/ask.md",
    "usage/update.md",
    "usage/make-docs.md",
    "usage/review.md",
    "usage/setup.md",
    "usage/signoff.md",
    "usage/pull-requests.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/private-key.md",
    "reference/repo-config.md",
    "reference/http-endpoints.md",
  ] },
  { "Operations" = [
    "operations/security.md",
    "operations/troubleshooting.md",
    "operations/development.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
